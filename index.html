<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Product preview card component</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <style>
      .attribution {
        font-size: 0.6875rem;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="product_container">
      <div class="product__img">
        <picture>
          <source
            media="(min-width: 768px)"
            srcset="./images/image-product-desktop.jpg"
          />

          <img
            class="mobile__image"
            src="./images/image-product-mobile.jpg"
            alt="Gabrielle Essence Perfume"
          />
        </picture>
      </div>

      <section class="product_body">
        <p class="caption">Perfume</p>
        <h1>Gabrielle Essence Eau De Parfum</h1>
        <p class="product__info">
          A floral, solar and voluptuous interpretation composed by Olivier
          Polge, Perfumer-Creator for the House of CHANEL.
        </p>
        <p class="price"><span>$149.99</span> <del>$169.99</del></p>
        <button class="btn">
          <img
            src="./images/icon-cart.svg"
            alt="icon-cart"
            class="cart__image"
          />Add to Cart
        </button>
      </section>
    </section>
    <!-- <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Your Name Here</a>.
    </footer> -->
  </body>
</html>
